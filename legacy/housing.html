<!DOCTYPE html>

<script>
$(document).ready(function(){
  $(".refresh").click(function(){ $(".imgcaptcha").attr("src","demo_captcha.php?_="+(new Date().getTime())); });
  $('#myForm').on('submit',function(e){
    e.preventDefault();
    var name=$('#name').val(); if(name==""){alert("Please enter your name");$('#name').focus();return false;}
    var emailReg=/^([\w-\.]+@([\w-]+\.)+[\w-]{2,4})?$/;   // allows empty string; iitgn-only check is commented out
    var emailaddressVal=$("#email").val();
    if(emailaddressVal==''){alert("Please enter your valid email id");$('#email').focus();return false;}
    else if(!emailReg.test(emailaddressVal)){alert("Please enter a valid email id");$('#email').focus();return false;}
    var phone=$('#contact').val().replace(/[^0-9]/g,'');
    if(phone.length!=10){alert('Mobile number must be 10 digits.');$('#contact').focus();return false;}
    var subject=$('#subject').val(); if(subject==""){alert("Please enter subject");$('#subject').focus();return false;}
    var spec_loc=$('#spec_loc').val(); if(spec_loc==""){alert("Please select apartment number");$('#spec_loc').focus();return false;}
    var available_time=$('#available_time').val(); if(available_time==""){alert("Please enter your available time");$('#available_time').focus();return false;}
    var s1=$('#s1').val(); if(s1==""){alert("Please select domain");$('#s1').focus();return false;}
    var s2=$('#s2').val(); if(s2==""){alert("Please select sub-domain-1");$('#s2').focus();return false;}
    var s3=$('#s3').val(); if(s3==""){alert("Please select sub-domain-2");$('#s3').focus();return false;}
    var captcha=$.trim($("#captcha").val()); if(captcha===""){alert("Please enter captcha code");$('#captcha').focus();return false;}
    var maintenance=$('#maintenance').val();
    $.ajax({
      url:"submit_housing_captcha.php", type:"POST", dataType:"text",
      data:{ name:name, email:emailaddressVal, contact:phone, subject:subject, spec_loc:spec_loc, available_time:available_time, country:s1, state:s2, city:s3, maintenance:maintenance, captcha:captcha },
      success:function(response){
        if(response==0){ alert("wrong captcha code!"); $("#MyEdit").html("wrong captcha code!"); }
        else if(response==2){ alert("We have some technical problem during request submission. Please fill the maintenance request form after some time."); $("#MyEdit").html("We have some technical problem ..."); }
        else { $(".imgcaptcha").attr("src","demo_captcha.php?_="+(new Date().getTime())); clear_form(); alert("Your query has been submitted successfully."); $("#MyEdit").html(response); /* server HTML injected */ }
      },
      error:function(xhr,status,error){ console.log("AJAX ERROR:",status,error); }
    });
    return false;
  });
  function clear_form(){ /* clears name,email,contact,subject,location fields,availability,s1,s2,s3,maintenance */ }
});
</script>
<script>
function ajaxFunction(choice){
  var httpxml; try{httpxml=new XMLHttpRequest();}catch(e){ /* legacy ActiveX fallbacks omitted */ alert("Your browser does not support AJAX!"); return false; }
  function stateChanged(){
    if(httpxml.readyState==4){
      var myObject=JSON.parse(httpxml.responseText);   // {value:{state1,city1}, state:[...], city:[...]}
      for(j=document.myForm.state.options.length-1;j>=0;j--) document.myForm.state.remove(j);
      var state1=myObject.value.state1;
      var optn=document.createElement("OPTION"); optn.text='Select Sub Domain-1'; optn.value=''; document.myForm.state.options.add(optn);
      for(i=0;i<myObject.state.length;i++){
        var optn=document.createElement("OPTION"); optn.text=myObject.state[i]; optn.value=myObject.state[i];
        document.myForm.state.options.add(optn);
        if(optn.value==state1){ document.myForm.state.options[i+1].selected=true; }
      }
      for(j=document.myForm.city.options.length-1;j>=0;j--) document.myForm.city.remove(j);
      var city1=myObject.value.city1;
      for(i=0;i<myObject.city.length;i++){
        var optn=document.createElement("OPTION"); optn.text=myObject.city[i]; optn.value=myObject.city[i];
        document.myForm.city.options.add(optn);
        if(optn.value==city1){ document.myForm.city.options[i].selected=true; }
      }
      // NOTE: #txtHint does not exist in the page -> likely TypeError here (legacy bug)
      document.getElementById("txtHint").style.background='#00f040';
      document.getElementById("txtHint").innerHTML='done';
    }
  }
  var url="ajax-dd3ck.php"; var country=myForm.country.value;
  if(choice!='s1'){var state=myForm.state.value;var city=myForm.city.value;}else{var state='';var city='';}
  url=url+"?country="+country+"&state="+state+"&city="+city+"&type=housing&id="+Math.random();
  myForm.st.value=state;
  document.getElementById("txtHint2").innerHTML=url;
  httpxml.onreadystatechange=stateChanged; httpxml.open("GET",url,true); httpxml.send(null);
  document.getElementById("txtHint").innerHTML="Please Wait....";   // also null in legacy pages
}
</script>
